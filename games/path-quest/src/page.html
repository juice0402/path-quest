const ico=s=>`<svg viewBox="22 22 56 56" aria-hidden="true">${s}</svg>`;
const nf=v=>Math.abs(v)>=1e4?(v/1e4).toFixed(Math.abs(v)>=1e5?0:1).replace(/\.0$/,'')+'万':String(v); // 12345 → 1.2万
const BLOCKS=[['#f7c3d4','#e29ab4'],['#bfe6d6','#8fcdb6'],['#fbe2a0','#e5bf63'],['#d8cdf6','#b4a3e8'],['#c4e2f5','#93c3e4']];
const SHADOW=rx=>`<ellipse cx="50" cy="86" rx="${rx}" ry="4.5" fill="rgba(74,53,65,.22)"/>`;
const EVIL=rx=>`<ellipse cx="50" cy="86" rx="${rx+6}" ry="7" fill="rgba(122,79,176,.24)"/><ellipse cx="50" cy="86" rx="${rx}" ry="4.5" fill="rgba(40,22,52,.38)"/>`; // the toys that fight stand on a dark purple stand (11/4: no red glow)
const soldier=(coat,extra)=>SHADOW(15)+
  '<rect x="42" y="66" width="7" height="18" rx="2" fill="#3d4170"/><rect x="51" y="66" width="7" height="18" rx="2" fill="#3d4170"/>'+
  `<rect x="39" y="44" width="22" height="26" rx="6" fill="${coat}"/>`+
  '<path d="M41 47 59 67M59 47 41 67" stroke="#fffaf6" stroke-width="3"/>'+

  '<rect x="42" y="13" width="16" height="22" rx="7" fill="#3d4170"/><path d="M42 33h16" stroke="#f2c14e" stroke-width="2.5"/>'+extra;
const SPR={
  start:'<rect x="20" y="50" width="60" height="34" rx="6" fill="#e889ad"/><rect x="20" y="50" width="60" height="8" fill="#d4689a"/><path d="M18 50 26 34h56l-2 16z" fill="#f7c3d4"/><path d="M50 61l3.5 7 7.5 1-5.5 5 1.5 7.5-7-3.8-7 3.8 1.5-7.5-5.5-5 7.5-1z" fill="#ffe08a"/>',
  ob:{
    grass:'<rect x="16" y="56" width="34" height="30" rx="4" fill="#e5bf63"/><rect x="16" y="52" width="34" height="28" rx="4" fill="#fbe2a0"/><path d="M16 52 33 28 50 52z" fill="#f08a8a"/><rect x="54" y="44" width="30" height="42" rx="5" fill="#8fcdb6"/><ellipse cx="69" cy="45" rx="15" ry="6" fill="#bfe6d6"/>',

    snow:'<circle cx="50" cy="64" r="18" fill="#fff" stroke="#c9d3ea" stroke-width="2.5"/><circle cx="50" cy="38" r="12" fill="#fff" stroke="#c9d3ea" stroke-width="2.5"/><rect x="41" y="20" width="18" height="10" rx="2" fill="#9f8fd6"/><path d="M50 40l9 2-9 2z" fill="#f29a3a"/><circle cx="46" cy="36" r="1.5" fill="#4a3541"/><circle cx="54" cy="36" r="1.5" fill="#4a3541"/><path d="M40 50q10 5 20 0" stroke="#e8607e" stroke-width="4" fill="none" stroke-linecap="round"/>',

async function proceed(){

async function stepTo(i){

    const e=c.foe;hero.classList.remove('walk');

function resolve(i){

    if(e.k==='coin'){pop(i,`+${addGold(e.v)}`,'p-gold');fly(i,SPR.coin,$('i-gold'));heroHop()}
    else if(e.k==='potion'){const h=Math.min(e.v,run.maxHp-run.hp);run.hp+=h;pop(i,`+${h}`,'p-heal');fly(i,SPR.heart,$('hp'));SND('eat');heroPose('eat',700)}

  if(c.gem&&run.hp>0){const v=c.gem;c.gem=0;pop(i,`+${addGold(v)}`,'p-gold',e?420:0);fly(i,SPR.gem,$('i-gold'),e?420:0);hit=true}

  e.hp=0;
  if(e.hp<=0){const g=addGold(e.gold);t.e=null;if(a)bits(a.x,a.y,10,TOYBITS[e.t]||TOYBITS.soldier,a.w*.7,4);fly(el,SPR.coin,$('i-gold'),120);return g}
  if(a)bits(a.x,a.y-a.w*.1,6,cls==='psn'?['#b48be0','#8b5fbf']:['#c9b6ff','#fff','#a8e6ff'],a.w*.4,4);bump(el);
}
function castHand(){ // a staff: after each fight, magic hits toys waiting in the hand
  const N=handN(),M=magDmg();if(!N)return;
  const k=shuffle(run.hand.map((t,k)=>t&&t.e&&t.e.k==='foe'&&!(QK[t.e.t]||{}).nomag?k:-1).filter(k=>k>=0)).slice(0,N);if(!k.length)return;
  k.forEach(x=>handHit(x,M,'mag'));renderHand();renderStats();
}
function stepMagic(){ // each step: spell books poison, poison bites, magic sticks hit what stands around the knight
  let hand=false;
  const P=pintN();
  if(P){run.pc=(run.pc|0)+1;if(run.pc%P===0){const c=run.hand.map((t,k)=>t&&t.e&&t.e.k==='foe'&&!(QK[t.e.t]||{}).nomag?k:-1).filter(k=>k>=0);if(c.length){handHit(c[rnd(c.length)],1,'psn');hand=true}}}
  run.hand.forEach((t,k)=>{if(t&&t.e&&t.e.k==='foe'&&t.e.psn){handHit(k,t.e.psn,'psn');hand=true}});
  const R=areaR(),M=magDmg();
  if(R){
    const r0=rowOf(run.at),c0=colOf(run.at);let n=0;
    for(let r=r0-R;r<=r0+R;r++)for(let c=c0-R;c<=c0+R;c++){
      if(c<0||c>=W||r<0)continue;const i=idOf(r,c),x=cellAt(i);if(!x)continue;
      const e=x.foe||(x.tile&&x.tile.gate&&x.tile.e);if(!e||e.k!=='foe')continue; // not the piece the king left
      if((QK[e.t]||{}).nomag){pop(i,'効かない','p-guard',n++*70);continue}
      e.hp-=M;const d=n++*70;
      if(e.hp<=0){const g=addGold(e.gold);if(x.foe)x.foe=null;else{x.tile.e=null;if(e.king)kingDrop(i)}updateCell(i);breakToy(i,e);pop(i,`+${g}`,'p-gold',d);fly(i,SPR.coin,$('i-gold'),d)}
      else{updateCell(i);pop(i,`-${M}`,'p-mag',d);setTimeout(()=>spark(i),d)}
    }
  }
  if(hand){renderHand();renderStats()}
}
function aceBurst(k){ // a cross block arrives: sparkles and a little hop
  const el=handEl.children[k],a=mid(el);if(!a||REDUCED)return;
  bits(a.x,a.y-a.w*.15,16,['#ffe58a','#ff9ec7','#a8e6ff','#c9b6ff','#fff'],a.w*.95,5);
}

/* ---------- the toy box of this climb (vampire-survivors style): every 10 rows three cards — a new toy weapon or charm,
   or the next level of one already in the box. weapons act on their own; a weapon at Lv5 with its charm evolves
   at the captain's chest or the dimension gate. all of it is for this climb only ---------- */
const MAXLV=5,SLOT_W=3,SLOT_C=3;
const ITEMS=[ // w: a toy weapon that acts on its own; ev: the charm it evolves with; en: the evolved name
  {id:'plane',w:1,n:'紙ひこうき',kd:'atk',ev:'clover',en:'ジェット紙ひこうき'},
  {id:'top',w:1,n:'ぐるぐるコマ',kd:'atk',ev:'spring',en:'竜巻ゴマ'},
  {id:'bomb',w:1,n:'ビー玉ばくだん',kd:'mag',ev:'cat',en:'宝石ばくだん'},
  {id:'boomer',w:1,n:'ブーメラン',kd:'roll',ev:'dice',en:'ブーメラン嵐'},
  {id:'bubble',w:1,n:'シャボン玉',kd:'def',ev:'block',en:'にじのシャボン'},
  {id:'spring',n:'ぜんまいバネ',kd:'atk'},
  {id:'block',n:'つみきの盾',kd:'def'},
  {id:'cookie',n:'ハートクッキー',kd:'hp'},
  {id:'clover',n:'四つ葉',kd:'gold'},
  {id:'honey',n:'はちみつ',kd:'hp'},
  {id:'cat',n:'まねきねこ',kd:'gold'},
  {id:'dice',n:'サイコロ',kd:'roll'},
  {id:'clock',n:'砂時計',kd:'mag'}
];
const IT_ID={};ITEMS.forEach(x=>IT_ID[x.id]=x);
const IT=()=>run.it||(run.it={});
const itLv=id=>(run&&run.it&&run.it[id])||0;
const isEvo=id=>!!(run&&run.evo&&run.evo[id]);
const itOwned=w=>ITEMS.filter(x=>!!x.w===!!w&&itLv(x.id)>0);
const L5=(a,lv)=>a[Math.min(MAXLV,Math.max(1,lv))-1];
const TOY={ // the numbers per level
  plane:{n:[1,1,2,2,3],p:[50,60,70,80,100]},
  top:{p:[20,30,40,50,70]},
  bomb:{e:[5,4,4,3,3],r:[1,1,2,2,2],p:[80,100,120,140,180]},
  boomer:{e:[3,2,2,1,1],n:[1,1,2,2,3]},
  bubble:{e:[6,5,4,3,3],m:[1,1,1,2,2]}
};
const toyDmg=p=>Math.max(1,Math.ceil(atkNow()*p/100));
function itDesc(id,lv){
  const t=TOY[id],g=a=>L5(a,lv);
  switch(id){
    case 'plane':return `置くたび、近くの敵へ${g(t.n)}機（攻撃${g(t.p)}%）`;
    case 'top':return `たたくたび追い打ち（攻撃${g(t.p)}%）`;
    case 'bomb':return `${g(t.e)}マスごとに爆発。まわり${g(t.r)}マスに攻撃${g(t.p)}%`;
    case 'boomer':return `${g(t.e)>1?g(t.e)+'回置くごとに':'置くたび、'}手持ちの敵${g(t.n)}体をたおす`;
    case 'bubble':return `${g(t.e)}マスごとにシャボン。攻撃を1回ふせぐ`;
    case 'spring':return '攻撃+25%';
    case 'block':return '守り+25%';
    case 'cookie':return '最大HP+25%';
    case 'clover':return '会心率+8%';
    case 'honey':return `勝つたびHP${3*lv}%回復`;
    case 'cat':return `金貨+${15*lv}%`;
    case 'dice':return 'リロール+1';
    case 'clock':return 'クールタイム-1マス';
  }
  return '';
}
const EVO_DESC={
  plane:'2倍の数がとび、ぜんぶ会心',
  top:'追い打ち100%。最初の1回はダメージなし',
  bomb:'2マスごとに大爆発（攻撃220%）。金貨2倍',
  boomer:'置くたび、手持ちの敵ぜんぶをたおす',
  bubble:'2マスごとにシャボン。割れるとHP回復'
};
function evoHint(x){ // the "?" also says which pair makes the big evolution
  if(x.w)return `（Lv${MAXLV}＋${IT_ID[x.ev].n}で大進化）`;
  const w=ITEMS.find(y=>y.ev===x.id);return w?`（${w.n}Lv${MAXLV}と大進化）`:'';
}
const evoReady=()=>run?ITEMS.filter(x=>x.w&&itLv(x.id)>=MAXLV&&!isEvo(x.id)&&itLv(x.ev)>0):[];
const evoCards=()=>evoReady().map(x=>({k:'evo',id:x.id,icon:'i_'+x.id,kd:'gold',v:'進化',n:x.en,s:`${x.n}＋${IT_ID[x.ev].n} → ${EVO_DESC[x.id]}`,evo:1}));
function itCard(x){
  const lv=itLv(x.id)+1,nw=lv===1;
  return {k:'it',id:x.id,icon:'i_'+x.id,kd:x.kd,v:nw?'NEW':`Lv${lv}`,n:x.n,lv,w:x.w?1:0,s:`${nw?'NEW':'Lv'+lv}：${itDesc(x.id,lv)}${evoHint(x)}`};
}
function levelUp(id){ // charms that raise a number do it now; the rest are read while climbing
  const it=IT(),lv=Math.min(MAXLV,(it[id]||0)+1);it[id]=lv;
  if(!run.q||run.q===ZERO)run.q={...ZERO};const q=run.q,P=PM();
  if(id==='spring')run.atk=Math.max(run.atk+P,Math.ceil(run.atk*1.25));
  if(id==='block')run.def=Math.max(run.def+P,Math.ceil(run.def*1.25));
  if(id==='cookie'){const n=Math.max(3*P,Math.ceil(run.maxHp*.25));run.maxHp+=n;run.hp+=n}
  if(id==='clover')q.crit=(q.crit||0)+.08;
  if(id==='cat')q.gold=(q.gold||0)+.15;
  if(id==='dice'){run.rolls+=1;q.roll=(q.roll||0)+1}
  if(id==='clock')q.cdr=(q.cdr||0)+1;
  if(id==='bubble'&&lv===1){run.bub=Math.max(run.bub|0,1);bubbleFx(true)}
}
function renderInv(el){ // the six slots: three weapons | three charms, with their level
  if(!el||!run)return;
  const chip=x=>{const ev=isEvo(x.id);return `<i class="${ev?'evo':''}" style="--kc:var(--k-${x.kd})" title="${ev?x.en:x.n}">${ico(SPR['i_'+x.id])}<b>${ev?'★':itLv(x.id)}</b></i>`};
  const row=(w,n)=>{const a=itOwned(w);return a.map(chip).join('')+'<i class="empty"></i>'.repeat(Math.max(0,n-a.length))};
  el.innerHTML=`<span class="ig"><small>武器</small><span class="ig-row">${row(1,SLOT_W)}</span></span><span class="sep"></span><span class="ig"><small>お守り</small><span class="ig-row">${row(0,SLOT_C)}</span></span>`;
}

/* ---------- the toy weapons at work ---------- */
function toss(a,b,art,ms,spin){ // like a shot, between any two points; a boomerang spins
  if(!a||!b||REDUCED)return;
  const f=document.createElement('div');f.className='fly';f.innerHTML=ico(art);document.body.appendChild(f);
  const ang=spin?0:Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
  f.animate([{transform:`translate(${a.x}px,${a.y}px) rotate(${ang}deg) scale(1.3)`},{transform:`translate(${b.x}px,${b.y}px) rotate(${ang+(spin?720:0)}deg) scale(1.3)`}],{duration:ms||300,easing:spin?'linear':'ease-in'}).onfinish=()=>f.remove();
}
const boardFoe=x=>x?(x.foe||(x.tile&&x.tile.gate&&x.tile.e&&x.tile.e.k==='foe'?x.tile.e:null)):null; // a toy standing on the field, or a captain in his gap
function nearFoe(){ // the closest one a little ahead of the knight
  const r0=rowOf(run.at),c0=colOf(run.at);let best=-1,bd=99;
  for(let r=Math.max(win.lo,r0-1);r<=Math.min(win.hi,r0+4);r++)for(let c=0;c<W;c++){
    const i=idOf(r,c),e=boardFoe(cellAt(i));if(!e||e.hp<=0)continue;
    const d=Math.max(Math.abs(r-r0),Math.abs(c-c0));if(d<bd){bd=d;best=i}
  }
  return best;
}
const handFoes=()=>run.hand.map((t,k)=>t&&t.e&&t.e.k==='foe'&&t.e.hp>0?k:-1).filter(k=>k>=0);
function hitBoard(i,d,cls,dl,gm){ // a toy weapon hits something on the field; the king still leaves his gear
  const x=cellAt(i),e=boardFoe(x);if(!e)return;
  e.hp-=d;
  if(e.hp<=0){
    const g=addGold(e.gold*(gm||1));
    if(x.foe)x.foe=null;else{x.tile.e=null;if(e.king)kingDrop(i)}
    updateCell(i);breakToy(i,e);pop(i,`+${g}`,'p-gold',dl);fly(i,SPR.coin,$('i-gold'),dl);if(e.boss)shake(8);
  }else{updateCell(i);pop(i,`-${d}`,cls,dl);setTimeout(()=>{spark(i);struck(elOf(i))},dl)}
  FXH.emit('toyhit',{i,d,cls});
}
async function toysAct(){ // after each block: the paper planes and the boomerang fly on their own, before the field toys act
  const pl=itLv('plane'),bm=itLv('boomer');if(!pl&&!bm)return;
  render();let hit=false;
  if(pl){
    const ev=isEvo('plane'),n=L5(TOY.plane.n,pl)*(ev?2:1),d=toyDmg(L5(TOY.plane.p,pl))*(ev?2:1);
    for(let s=0;s<n;s++){
      const i=nearFoe();
      if(i>=0){SND('plane');shoot(run.at,i,SPR.i_plane,240);await sleep(REDUCED?30:200);hitBoard(i,d,ev?'p-crit':'p-toy',0);hit=true;continue}
      const hs=handFoes();if(!hs.length)break;
      const k=hs[rnd(hs.length)];SND('plane');toss(spot(run.at),mid(handEl.children[k]),SPR.i_plane,240);await sleep(REDUCED?30:200);handHit(k,d,'toy');renderHand();hit=true;
    }
  }
  if(bm){
    const ev=isEvo('boomer'),d=toyDmg(100);run.bmc=(run.bmc|0)+1;
    let ks=ev||run.bmc>=L5(TOY.boomer.e,bm)?shuffle(handFoes()):[];if(!ev)ks=ks.slice(0,L5(TOY.boomer.n,bm));
    if(ks.length){run.bmc=0;SND('boomer');
      ks.forEach((k,j)=>setTimeout(()=>toss(spot(run.at),mid(handEl.children[k]),SPR.i_boomer,300,true),REDUCED?0:j*70));
      await sleep(REDUCED?30:300+ks.length*70);ks.forEach(k=>handHit(k,d,'toy'));renderHand();hit=true;
    }
  }
  if(hit){renderStats();save();await sleep(REDUCED?0:140)}
}
function boom(R,d,gm){ // the marble bomb: everything around the knight, and the toys waiting in the hand
  const a=spot(run.at);if(a&&!REDUCED){bits(a.x,a.y,22,['#a8d8f3','#ee88ac','#ffe58a','#fff'],a.w*(1+R*.6),6);shake(5)}
  FXH.emit('boom',{at:run.at,R});
  const r0=rowOf(run.at),c0=colOf(run.at);let n=0;
  for(let r=r0-R;r<=r0+R;r++)for(let c=c0-R;c<=c0+R;c++){if(c<0||c>=W||r<0)continue;const i=idOf(r,c);if(boardFoe(cellAt(i))){hitBoard(i,d,'p-toy',n*70,gm);n++}}
  let h=false;run.hand.forEach((t,k)=>{const e=t&&t.e;if(e&&e.k==='foe'){if(gm>1)e.gold*=gm;handHit(k,d,'toy');h=true}});
  if(h)renderHand();renderStats();
}
function bubbleFx(on){
  if(on)SND('bubble');
  hero.classList.toggle('bub',!!run&&(run.bub|0)>0);
  const a=on&&spot(run.at);if(a&&!REDUCED)bits(a.x,a.y-a.w*.1,8,['#e6f6ff','#a8d8f3','#c9b6ff'],a.w*.6,4);
}
function bubbleBlock(at){ // a bubble takes one hit; the rainbow one gives a little life back
  if(!((run.bub|0)>0))return false;
  run.bub--;SND('pop');bubbleFx(false);
  const a=spot(at);if(a&&!REDUCED)bits(a.x,a.y-a.w*.1,12,['#e6f6ff','#a8d8f3','#c9b6ff','#fff'],a.w*.9,5);
  if(isEvo('bubble')){const h=Math.min(Math.ceil(run.maxHp*.1),run.maxHp-run.hp);if(h>0){run.hp+=h;setTimeout(()=>pop(at,`+${h}`,'p-heal'),220)}}
  return true;
}
function stepToys(){ // each step: the marble bomb ticks, the bubble wand blows
  const b=itLv('bomb');
  if(b){const ev=isEvo('bomb');run.bc=(run.bc|0)+1;if(run.bc>=(ev?2:L5(TOY.bomb.e,b))){run.bc=0;boom(ev?3:L5(TOY.bomb.r,b),toyDmg(ev?220:L5(TOY.bomb.p,b)),ev?2:1)}}
  const s=itLv('bubble');
  if(s){const ev=isEvo('bubble'),mx=ev?3:L5(TOY.bubble.m,s);if((run.bub|0)<mx){run.bubc=(run.bubc|0)+1;if(run.bubc>=(ev?2:L5(TOY.bubble.e,s))){run.bubc=0;run.bub=(run.bub|0)+1;bubbleFx(true)}}else run.bubc=0}
}

/* ---------- rewards: every 10 rows ---------- */
function pickRewards(){ // three cards from the toy box; ones already in it come up more often, so a build grows
  const ws=itOwned(1).length,cs=itOwned(0).length;
  const cand=ITEMS.filter(x=>{const l=itLv(x.id);return l?l<MAXLV:(x.w?ws<SLOT_W:cs<SLOT_C)}).map(x=>({x,wt:itLv(x.id)?2:1}));
  const out=[];
  if(!ws){const w=shuffle(cand.filter(c=>c.x.w))[0];if(w){out.push(w.x);cand.splice(cand.indexOf(w),1)}} // the first box always holds a weapon
  while(out.length<3&&cand.length){
    let r=cand.reduce((a,c)=>a+c.wt,0)*Math.random(),k=0;
    while(k<cand.length-1&&(r-=cand[k].wt)>0)k++;
    out.push(cand[k].x);cand.splice(k,1);
  }
  const cards=shuffle(out.map(itCard));
  if(cards.length<3){ // the box is full and grown: the old helpers fill the gaps
    const lv=lvOf(rowOf(run.at)),heal=Math.max(1,Math.ceil(run.maxHp*.3)),g=2*(6+2*lv);
    const fb=[
      {k:'heal',icon:'potion',kd:'hp',v:`+${heal}`,n:'HP回復',s:`HP+${heal}`,val:heal},
      {k:'gold',icon:'coin',kd:'gold',v:`+${gainOf(g)}`,n:'金貨',s:'強化に使える',val:g},
      {k:'roll',icon:'dice',kd:'roll',v:'+2',n:'リロール',s:'リロール+2'}
    ].filter(x=>x.k!=='heal'||run.hp<run.maxHp);
    cards.push(...fb.slice(0,3-cards.length));
  }
  return cards;
}
function pickPowers(){ // big, for this climb only: one each time the knight steps into a new dimension; an evolution can wait here too
  const q=run.q||ZERO,P=PM(),gi=id=>GEAR_ID[id]?GEAR_ID[id].art:null;
  const pool=[
    {k:'patk',icon:'sword',kd:'atk',v:'×1.5',n:'攻撃',s:`攻撃×1.5（いま${run.atk}）`},
    {k:'php',icon:'heart',kd:'hp',v:'×1.5',n:'最大HP',s:'最大HP×1.5・HP全回復'},
    {k:'pdef',icon:'shield',kd:'def',v:run.def?'×1.5':`+${P}`,n:'守り',s:run.def?`守り×1.5（いま${run.def}）`:`守り+${P}`},
    {k:'pcrit',icon:'sword',kd:'atk',v:'+15%',n:'会心',s:'会心率+15%'},
    {k:'pcross',art:SK_ART.cross,kd:'gold',v:'×2',n:'十字',s:'十字の積み木が出やすくなる'},
    {k:'pleech',icon:'heart',kd:'hp',v:`+${2*P}`,n:'吸収',s:`勝つたびHP+${2*P}`},
    {k:'proll',icon:'dice',kd:'roll',v:'+3',n:'リロール',s:'リロール+3'},
    {k:'pref',gi:gi('mr2'),icon:'shield',kd:'def',v:'+50%',n:'はね返し',s:'受けたダメージの50%を返す'}
  ];
  if(qv('mag')>0||qv('pint')>0)pool.push({k:'pmag',gi:gi('wst1'),icon:'sword',kd:'mag',v:'×2',n:'魔法・毒',s:'魔法と毒のダメージ×2'});
  if(!q.first)pool.push({k:'pfirst',icon:'sword',kd:'atk',v:'1st',n:'先制攻撃',s:'いつも先に攻撃'});
  if(ITEMS.some(x=>itLv(x.id)&&itLv(x.id)<MAXLV))pool.push({k:'allup',icon:'hand',kd:'gold',v:'Lv+1',n:'おもちゃ箱',s:'武器とお守りがぜんぶLv+1'});
  const ev=evoCards().slice(0,2); // a toy that can evolve always shows up here
  return [...ev,...shuffle(pool).slice(0,3-ev.length).map(x=>{if(!x.gi)delete x.gi;return x})];
}
function showReward(){
  const pw=run.rk==='power',ch=run.rk==='chest';
  $('rw').classList.toggle('power',pw);$('rw').classList.toggle('chest',ch);
  $('r-icon').innerHTML=ico(pw?SPR.portal:SPR.chest);
  $('r-sub').textContent=pw?'次元のちから':ch?'大将の宝箱':'ごほうび';

  $('r-info').textContent='';$('r-list').className='rw-cards n'+run.rewards.length;
  const pips=x=>x.k==='it'?`<span class="rc-lv">${Array.from({length:MAXLV},(_,k)=>`<i class="${k<x.lv-1?'on':k===x.lv-1?'up':''}"></i>`).join('')}</span>`:'';
  const TAG={heal:'回復',gold:'金貨',roll:'リロール',maxhp:'体力',atk:'攻撃',def:'守り',evo:'大進化',allup:'おもちゃ箱'};
  $('r-list').innerHTML=run.rewards.map((x,i)=>{
    const it=x.k==='it',tag=it?(x.w?'武器':'お守り'):TAG[x.k]||(pw?'次元のちから':'');
    const v=it?(x.lv===1?'<em class="rr-v nw">NEW</em>':`<em class="rr-v">Lv${x.lv-1}→${x.lv}</em>`):typeof x.v==='string'?`<em class="rr-v">${x.v}</em>`:'';
    const d=it?itDesc(x.id,x.lv):(x.s||'');const h=it?evoHint(IT_ID[x.id]).replace(/^（|）$/g,''):'';
    return `<button class="rrow k-${x.kd||'gold'}${x.evo?' evo':''}" type="button" data-i="${i}" style="--n:${i};--r:${i%2?-7:6}deg" aria-label="${x.n||x.t}：${d}"><span class="rr-art">${x.art?svg(x.art):ico(x.gi||SPR[x.icon])}</span><span class="rr-main"><span class="rr-top">${tag?`<i class="rr-tag${it&&!x.w?' ch':''}">${tag}</i>`:''}<b class="rr-name">${x.n||x.t}</b>${v}</span><span class="rr-d">${d}</span>${h?`<span class="rr-h">${h}</span>`:''}</span></button>`}).join('');
  rPick=-1;rReady=performance.now()+(REDUCED?0:550);$('r-go').disabled=true;$('r-go').textContent='えらんでね';$('r-list').classList.remove('has','picked');

var AUD=(()=>{

  const QL={'':[0,4,7],m:[0,3,7],'7':[0,4,7,10],maj7:[0,4,7,11],m7:[0,3,7,10],dim:[0,3,6],sus4:[0,5,7]};
  function chordOf(s){const m=/^([A-G])([#b]?)(.*)$/.exec(s);return {r:NT[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0),iv:QL[m[3]]||QL['']}}
  const toks=s=>s.replace(/\|/g,' ').trim().split(/\s+/);
  for(const k in SONGS){ /* read every tune once */
    const S=SONGS[k];S.bars=S.chords.split('|').map(b=>b.trim().split(/\s+/).map(chordOf));
    S.grid=Math.max(...S.tracks.map(x=>x.res));
    S.tracks.forEach(x=>{if(x.mel)x.tk=x.mel==='@0'?S.tracks[0].tk:toks(x.mel);if(x.pat)x.tk=toks(x.pat)});
  }
  function tone(c,tok,base){ /* a pattern token on a chord → midi notes */
    const r=base+c.r,iv=c.iv;
    switch(tok){case 'R':return [r];case '3':return [r+iv[1]];case '5':return [r+iv[2]];case '7':return [iv[3]!=null?r+iv[3]:r+12];
      case '8':return [r+12];case 'h':return [r+iv[1]+12];case 'H':return [r+iv[2]+12];case 'c':case 'C':{const q=r-(c.r>=7?12:0);return tok==='c'?[q+iv[1],q+iv[2],q+12]:[q,q+iv[1],q+iv[2]]}}
    return [];
  }

  /* ---- the player: looks a little ahead and books the notes on the audio clock ---- */
  function start(id,o){

    const tr=(o&&o.tr)||0,bpm=S.bpm*((o&&o.fast)||1),t0=ctx.currentTime+.06;
    const g=ctx.createGain();g.gain.setValueAtTime(.0001,t0);g.gain.setTargetAtTime(1,t0,S.once?.02:.35);g.connect(mBus);

    players.push(p);return p;

  function fade(p){if(!p||p.end)return;const t=ctx.currentTime;p.g.gain.cancelScheduledValues(t);p.g.gain.setTargetAtTime(.0001,t,.3);p.end=t+1.4}

    const S=p.S,G=S.grid,perBar=S.bpb*G,bar=Math.floor(step/perBar)%S.bars.length,inBar=step%perBar;
    const cs=S.bars[bar],c=cs[Math.min(cs.length-1,Math.floor(inBar/(perBar/cs.length)))];
    for(const x of S.tracks){
      const k=G/x.res;if(step%k)continue;
      const idx=step/k,tk=x.tk,i=x.mel?idx%tk.length:idx%(S.bpb*x.res),tok=tk[i];
      if(tok==='.'||tok==='-')continue;
      if(x.drum){DR[x.drum](t,x.v*(tok==='X'?1.4:1),p.g);continue}
      const len=holdOf(tk,i)*k*p.dt,v=x.v;
      if(x.mel){const m=nm(tok);if(m!=null)V[x.ins](t,hz(m+p.tr+(x.tr||0)),len,v,p.g);continue}
      const ns=tone(c,tok,12*((x.oct||4)+1)+p.tr);const vv=ns.length>1?v*.7:v;

  function tick(){
    if(bouncing||!ctx||ctx.state!=='running')return;
    const now=ctx.currentTime;
    for(const p of players){
      if(p.next<now-.25){const n=Math.ceil((now-p.next)/p.dt);p.step+=n;p.next+=n*p.dt} /* woke up late: skip, do not burst */
      while(p.next<now+.14&&!(p.total&&p.step>=p.total)){if(on)book(p,p.step,p.next);p.step++;p.next+=p.dt}
      if(p.total&&p.step>=p.total&&!p.end)p.end=p.next+1.6;
    }
    players=players.filter(p=>{if(p.end&&now>p.end){try{p.g.disconnect()}catch(err){}if(cur===p)cur=null;if(jing===p)jing=null;return false}return true});
  }

  /* ---- which tune now ---- */
  const vis=id=>{const e=document.getElementById(id);return !!e&&!e.hidden};
  function wanted(){
    if(vis('s-over'))return jing?jing.key:'home';
    if(typeof run==='undefined'||!run||vis('s-title')||vis('s-shop'))return 'home';
    const r=rowOf(run.at),s=stepOf(r),dm=dimOf(r);
    if(s>0&&(s%SPAN>=SPAN-3||s%DIM_LEN>=DIM_LEN-3))return 'boss'+(dm?'@'+dm:'');
    return areaOf(r).k+(dm?'@'+dm:'');
  }
  function sync(){
    if(bouncing||!live()||document.hidden)return;
    const w=wanted();if(cur&&cur.key===w&&!cur.end)return;
    if(jing&&w===jing.key)return;
    const [id,dm]=w.split('@'),d=+dm||0;
    fade(cur);cur=start(id,{key:w,tr:[0,2,-3,5][d%4],fast:d?1.05:1});
  }
  function over(kind){ /* the result paper: a short tune, then the home tune */
    if(!live())return;fade(cur);cur=null;if(jing)fade(jing);jing=start(kind,{key:kind});
  }

  /* ---- little sounds ---- */
  const tn=(ins,m,t,d,v)=>V[ins](t,hz(m),d||.2,v,sBus);
  function sweep(type,f1,f2,t,dur,v,lp){

    else if(a==='snow'){const b=el.querySelector('.lf-blk');if(b&&!REDUCED)b.animate([{opacity:0},{opacity:1,offset:.1},{opacity:1,offset:.8},{opacity:0}],{duration:700});pop(i,'♪','lf-note')}
    else if(a==='castle'){const p=el.querySelector('.lf-pen');if(p&&!REDUCED)p.animate([{rotate:'0deg'},{rotate:'-14deg'},{rotate:'10deg'},{rotate:'-5deg'},{rotate:'0deg'}],{duration:600,easing:'ease-out'});if(m)bits(m.x,m.y-m.w*.35,5,BITC.castle,m.w*.35,4)}
  });

  /* every 10 steps: the bunting cheers and a little confetti; now and then a surprise passes by */
  function fire(k){
    if(REDUCED||!run)return;
    if(k==='train'||k==='band'){
      if(S.tr)return;const r0=rowOf(run.at)-1,e=elOf(idOf(r0,0));if(!e)return;
      const rev=Math.random()<.5,el=document.createElement('div');el.className='lf-'+k+(rev?' lf-rev':'');el.setAttribute('aria-hidden','true');
      el.innerHTML=`<b class="lf-1 lf-s-${k}"></b>`+(k==='train'?'<i></i>':'');board.appendChild(el);
      const bw=board.clientWidth,w=el.offsetWidth;
      const a=el.animate([{transform:`translateX(${rev?bw:-w}px)`},{transform:`translateX(${rev?-w:bw}px)`}],{duration:k==='train'?5600:8000,easing:'linear'});
      S.tr={el,a,r:r0};placeTrain();a.onfinish=()=>{el.remove();if(S.tr&&S.tr.el===el)S.tr=null};
    }else if(k==='balloon'&&S.sky){
      const b=document.createElement('i'),fw=S.sky.clientWidth,fh=S.sky.clientHeight,x=fw*(.1+Math.random()*.72);
      b.className='lf-bal lf-1 lf-s-bal'+rnd(3);S.sky.appendChild(b);
      b.animate([{translate:`${x}px ${fh+10}px`},{translate:`${x+26}px ${fh*.55}px`,offset:.45},{translate:`${x-12}px -70px`}],{duration:10000,easing:'linear'}).onfinish=()=>b.remove();
    }else if(k==='star'&&S.sky){
      const s=document.createElement('i'),fw=S.sky.clientWidth,fh=S.sky.clientHeight,x0=fw*(.35+Math.random()*.45),y0=fh*(.06+Math.random()*.22),g=148+Math.random()*14,rd=g*Math.PI/180,L=fw*.55;
      s.className='lf-star';S.sky.appendChild(s);
      s.animate([{transform:`translate(${x0}px,${y0}px) rotate(${g}deg) scaleX(.2)`,opacity:0},{opacity:1,offset:.25},{transform:`translate(${x0+Math.cos(rd)*L}px,${y0+Math.sin(rd)*L}px) rotate(${g}deg) scaleX(1)`,opacity:0}],{duration:1100,easing:'ease-in'}).onfinish=()=>s.remove();
    }
  }
  FXH.add('reach',({r,s})=>{
    if(!run||s<=0)return;
    if(s%10===0){S.cheer={r,t:now()};if(S.layer&&S.layer.isConnected)layer();
      if(s%SPAN&&s%DIM_LEN){const m=spot(run.at);if(m)bits(m.x,m.y-m.w*.3,14,PAL.map(p=>p[0]).concat(['#fff']),m.w*.9,5)}
      return}
    if(REDUCED||s<5||r-S.lastEv<8||Math.random()>.17)return;
    S.lastEv=r;const a=areaOf(r).k,d=dimOf(r),x=Math.random();
    fire(d===2&&x<.6?'star':a==='castle'&&x<.45?'band':x<.6?'train':'balloon');
  });
  return {fire,S};
})();
if(window.PQ)window.PQ.LF=LF;
/* ===== end of fx module C ===== */

showTitle();
})();
