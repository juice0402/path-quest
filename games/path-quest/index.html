function evoHint(x){ // the "?" also says which pair makes the big evolution
  if(x.w)return `（Lv${MAXLV}＋${IT_ID[x.ev].n}で大進化）`;
  const w=ITEMS.find(y=>y.ev===x.id);return w?`（${w.n}のLv${MAXLV}と合わせて大進化）`:'';
}
const evoReady=()=>run?ITEMS.filter(x=>x.w&&itLv(x.id)>=MAXLV&&!isEvo(x.id)&&itLv(x.ev)>0):[];
const evoCards=()=>evoReady().map(x=>({k:'evo',id:x.id,icon:'i_'+x.id,kd:'gold',v:'進化',n:x.en,s:`${x.n}＋${IT_ID[x.ev].n} → ${EVO_DESC[x.id]}`,evo:1}));
function itCard(x){
  const lv=itLv(x.id)+1,nw=lv===1;
  return {k:'it',id:x.id,icon:'i_'+x.id,kd:x.kd,v:nw?'NEW':`Lv${lv}`,n:x.n,lv,w:x.w?1:0,s:`${nw?'NEW':'Lv'+lv}：${itDesc(x.id,lv)}${evoHint(x)}`};
}
function levelUp(id){ // charms that raise a number do it now; the rest are read while climbing
  const it=IT(),lv=Math.min(MAXLV,(it[id]||0)+1);it[id]=lv;
  if(!run.q||run.q===ZERO)run.q={...ZERO};const q=run.q,P=PM();
  if(id==='spring')run.atk=Math.max(run.atk+P,Math.ceil(run.atk*1.25));
  if(id==='block')run.def=Math.max(run.def+P,Math.ceil(run.def*1.25));
  if(id==='cookie'){const n=Math.max(3*P,Math.ceil(run.maxHp*.25));run.maxHp+=n;run.hp+=n}
  if(id==='clover')q.crit=(q.crit||0)+.08;
  if(id==='cat')q.gold=(q.gold||0)+.15;
  if(id==='dice'){run.rolls+=1;q.roll=(q.roll||0)+1}
  if(id==='clock')q.cdr=(q.cdr||0)+1;
  if(id==='bubble'&&lv===1){run.bub=Math.max(run.bub|0,1);bubbleFx(true)}
}
function renderInv(el){ // the six slots: three weapons | three charms, with their level
  if(!el||!run)return;
  const chip=x=>{const ev=isEvo(x.id);return `<i class="${ev?'evo':''}" style="--kc:var(--k-${x.kd})" title="${ev?x.en:x.n}">${ico(SPR['i_'+x.id])}<b>${ev?'★':itLv(x.id)}</b></i>`};
  const row=(w,n)=>{const a=itOwned(w);return a.map(chip).join('')+'<i class="empty"></i>'.repeat(Math.max(0,n-a.length))};
  el.innerHTML=row(1,SLOT_W)+'<span class="sep"></span>'+row(0,SLOT_C);
}

/* ---------- the toy weapons at work ---------- */
function toss(a,b,art,ms,spin){ // like a shot, between any two points; a boomerang spins
  if(!a||!b||REDUCED)return;
  const f=document.createElement('div');f.className='fly';f.innerHTML=ico(art);document.body.appendChild(f);
  const ang=spin?0:Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
  f.animate([{transform:`translate(${a.x}px,${a.y}px) rotate(${ang}deg) scale(1.3)`},{transform:`translate(${b.x}px,${b.y}px) rotate(${ang+(spin?720:0)}deg) scale(1.3)`}],{duration:ms||300,easing:spin?'linear':'ease-in'}).onfinish=()=>f.remove();
}
const boardFoe=x=>x?(x.foe||(x.tile&&x.tile.gate&&x.tile.e&&x.tile.e.k==='foe'?x.tile.e:null)):null; // a toy standing on the field, or a captain in his gap
function nearFoe(){ // the closest one a little ahead of the knight
  const r0=rowOf(run.at),c0=colOf(run.at);let best=-1,bd=99;
  for(let r=Math.max(win.lo,r0-1);r<=Math.min(win.hi,r0+4);r++)for(let c=0;c<W;c++){
    const i=idOf(r,c),e=boardFoe(cellAt(i));if(!e||e.hp<=0)continue;
    const d=Math.max(Math.abs(r-r0),Math.abs(c-c0));if(d<bd){bd=d;best=i}
  }
  return best;
}
const handFoes=()=>run.hand.map((t,k)=>t&&t.e&&t.e.k==='foe'&&t.e.hp>0?k:-1).filter(k=>k>=0);
function hitBoard(i,d,cls,dl,gm){ // a toy weapon hits something on the field; the king still leaves his gear
  const x=cellAt(i),e=boardFoe(x);if(!e)return;
  e.hp-=d;
  if(e.hp<=0){
    const g=addGold(e.gold*(gm||1));
    if(x.foe)x.foe=null;else x.tile.e=e.king?{k:'gear',g:pickGear(SLOTS[rnd(3)].k,Math.min(4,dimOf(rowOf(i))+2),true).id}:null;
    updateCell(i);breakToy(i,e);pop(i,`+${g}`,'p-gold',dl);fly(i,SPR.coin,$('i-gold'),dl);if(e.boss)shake(8);
  }else{updateCell(i);pop(i,`-${d}`,cls,dl);setTimeout(()=>{spark(i);struck(elOf(i))},dl)}
}
async function toysAct(){ // after each block: the paper planes and the boomerang fly on their own, before the field toys act
  const pl=itLv('plane'),bm=itLv('boomer');if(!pl&&!bm)return;
  render();let hit=false;
  if(pl){
    const ev=isEvo('plane'),n=L5(TOY.plane.n,pl)*(ev?2:1),d=toyDmg(L5(TOY.plane.p,pl))*(ev?2:1);
    for(let s=0;s<n;s++){
      const i=nearFoe();
      if(i>=0){shoot(run.at,i,SPR.i_plane,240);await sleep(REDUCED?30:200);hitBoard(i,d,ev?'p-crit':'p-toy',0);hit=true;continue}
      const hs=handFoes();if(!hs.length)break;
      const k=hs[rnd(hs.length)];toss(spot(run.at),mid(handEl.children[k]),SPR.i_plane,240);await sleep(REDUCED?30:200);handHit(k,d,'mag');renderHand();hit=true;
    }
  }
  if(bm){
    const ev=isEvo('boomer'),d=toyDmg(ev?150:L5(TOY.boomer.p,bm));
    let ks=shuffle(handFoes());if(!ev)ks=ks.slice(0,L5(TOY.boomer.n,bm));
    if(ks.length){
      ks.forEach((k,j)=>setTimeout(()=>toss(spot(run.at),mid(handEl.children[k]),SPR.i_boomer,300,true),REDUCED?0:j*70));
      await sleep(REDUCED?30:300+ks.length*70);ks.forEach(k=>handHit(k,d,'mag'));renderHand();hit=true;
    }
  }
  if(hit){renderStats();save();await sleep(REDUCED?0:140)}
}
function boom(R,d,gm){ // the marble bomb: everything around the knight, and the toys waiting in the hand
  const a=spot(run.at);if(a&&!REDUCED){bits(a.x,a.y,22,['#a8d8f3','#ee88ac','#ffe58a','#fff'],a.w*(1+R*.6),6);shake(5)}
  const r0=rowOf(run.at),c0=colOf(run.at);let n=0;
  for(let r=r0-R;r<=r0+R;r++)for(let c=c0-R;c<=c0+R;c++){if(c<0||c>=W||r<0)continue;const i=idOf(r,c);if(boardFoe(cellAt(i))){hitBoard(i,d,'p-toy',n*70,gm);n++}}
  let h=false;run.hand.forEach((t,k)=>{const e=t&&t.e;if(e&&e.k==='foe'){if(gm>1&&e.hp<=d)e.gold*=gm;handHit(k,d,'mag');h=true}});
  if(h)renderHand();renderStats();
}
function bubbleFx(on){
  hero.classList.toggle('bub',!!run&&(run.bub|0)>0);
  const a=on&&spot(run.at);if(a&&!REDUCED)bits(a.x,a.y-a.w*.1,8,['#e6f6ff','#a8d8f3','#c9b6ff'],a.w*.6,4);
}
function bubbleBlock(at){ // a bubble takes one hit; the rainbow one gives a little life back
  if(!((run.bub|0)>0))return false;
  run.bub--;bubbleFx(false);
  const a=spot(at);if(a&&!REDUCED)bits(a.x,a.y-a.w*.1,12,['#e6f6ff','#a8d8f3','#c9b6ff','#fff'],a.w*.9,5);
  if(isEvo('bubble')){const h=Math.min(Math.ceil(run.maxHp*.1),run.maxHp-run.hp);if(h>0){run.hp+=h;setTimeout(()=>pop(at,`+${h}`,'p-heal'),220)}}
  return true;
}
function stepToys(){ // each step: the marble bomb ticks, the bubble wand blows
  const b=itLv('bomb');
  if(b){const ev=isEvo('bomb');run.bc=(run.bc|0)+1;if(run.bc>=(ev?2:L5(TOY.bomb.e,b))){run.bc=0;boom(ev?3:L5(TOY.bomb.r,b),toyDmg(ev?220:L5(TOY.bomb.p,b)),ev?2:1)}}
  const s=itLv('bubble');
  if(s){const ev=isEvo('bubble'),mx=ev?3:L5(TOY.bubble.m,s);if((run.bub|0)<mx){run.bubc=(run.bubc|0)+1;if(run.bubc>=(ev?2:L5(TOY.bubble.e,s))){run.bubc=0;run.bub=(run.bub|0)+1;bubbleFx(true)}}else run.bubc=0}
}

/* ---------- rewards: every 10 rows ---------- */
function pickRewards(){ // three cards from the toy box; ones already in it come up more often, so a build grows
  const ws=itOwned(1).length,cs=itOwned(0).length;
  const cand=ITEMS.filter(x=>{const l=itLv(x.id);return l?l<MAXLV:(x.w?ws<SLOT_W:cs<SLOT_C)}).map(x=>({x,wt:itLv(x.id)?2:1}));
  const out=[];
  if(!ws){const w=shuffle(cand.filter(c=>c.x.w))[0];if(w){out.push(w.x);cand.splice(cand.indexOf(w),1)}} // the first box always holds a weapon
  while(out.length<3&&cand.length){
    let r=cand.reduce((a,c)=>a+c.wt,0)*Math.random(),k=0;
    while(k<cand.length-1&&(r-=cand[k].wt)>0)k++;
    out.push(cand[k].x);cand.splice(k,1);
  }
  const cards=shuffle(out.map(itCard));
  if(cards.length<3){ // the box is full and grown: the old helpers fill the gaps
    const lv=lvOf(rowOf(run.at)),heal=Math.max(1,Math.ceil(run.maxHp*.3)),g=2*(6+2*lv);
    const fb=[
      {k:'heal',icon:'potion',kd:'hp',v:`+${heal}`,n:'HP回復',s:`HPを${heal}回復（いま ${Math.max(0,run.hp)}/${run.maxHp}）`,val:heal},
      {k:'gold',icon:'coin',kd:'gold',v:`+${gainOf(g)}`,n:'金貨',s:'持ち帰って強化に使える',val:g},
      {k:'roll',icon:'dice',kd:'roll',v:'+2',n:'リロール',s:`手持ちの入れかえが2回ふえる（いま ${run.rolls}）`}
    ].filter(x=>x.k!=='heal'||run.hp<run.maxHp);
    cards.push(...fb.slice(0,3-cards.length));
  }
  return cards;
}
function pickPowers(){ // big, for this climb only: one each time the knight steps into a new dimension; an evolution can wait here too
  const q=run.q||ZERO,P=PM(),gi=id=>GEAR_ID[id]?GEAR_ID[id].art:null;
  const pool=[
    {k:'patk',icon:'sword',kd:'atk',v:'×1.5',n:'攻撃',s:`攻撃が1.5倍（いま ${run.atk}）`},
    {k:'php',icon:'heart',kd:'hp',v:'×1.5',n:'最大HP',s:`最大HPが1.5倍、HPもまんたん（いま ${run.maxHp}）`},

function countUp(el,to,ms,pre){ // a number that rolls up; a tap anywhere finishes it

  const t0=performance.now(),job={el,to,pre,done:false};cuJobs.push(job);
  const f=t=>{if(job.done)return;const k=Math.min(1,(t-t0)/ms);el.textContent=pre+nf(Math.round(to*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(f);else{job.done=true;bump(el.parentElement)}};

  setOver(dropCell(e.clientX,e.clientY));
},{passive:false});
function endPointer(e,cancel){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;
  if(ghost){ghost.remove();ghost=null}
  setOver(-1);
  if(cancel)return;
  if(d.moving){
    const t=dropCell(e.clientX,e.clientY);
    if(t>=0)place(t,d.slot);else flashSlot(d.slot);
    return;
  }
  if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>10)return;
  if(d.slot>=0)tapSlot(d.slot);else if(d.cell>=0)tapCell(d.cell);
}
document.addEventListener('pointerup',e=>endPointer(e,false));
document.addEventListener('pointercancel',e=>endPointer(e,true));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.board,.tray,.drawer'))e.preventDefault()});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  if(!run||run.phase!=='build'||busy)return;
  const s=e.target.closest&&e.target.closest('.slot'),c=e.target.closest&&e.target.closest('.cell');
  if(s&&handEl.contains(s)){e.preventDefault();tapSlot(+s.dataset.i)}
  else if(c&&board.contains(c)){e.preventDefault();tapCell(+c.dataset.i)}
});

/* ---------- buttons ---------- */
rollBtn.addEventListener('click',reroll);
pullBtn.addEventListener('click',()=>setDrawer(!drawerOpen,false));
{ // a tap asks first; holding until the ring fills goes home at once
  const q=$('quit');let t=0,held=false;
  const stop=()=>{clearTimeout(t);q.classList.remove('hold')};
  q.addEventListener('pointerdown',e=>{
    if(!run||busy||(e.pointerType==='mouse'&&e.button!==0))return;
    held=false;q.classList.add('hold');
    t=setTimeout(()=>{held=true;stop();if(run&&!busy)gameOver('quit')},650);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(k=>q.addEventListener(k,stop));
  q.addEventListener('contextmenu',e=>e.preventDefault());
  q.addEventListener('click',()=>{
    if(held){held=false;return}
    if(!run||busy)return;
    $('q-text').textContent=`ここまでの金貨 ${run.gold} を持ち帰って、強化に使える。`;renderInv($('q-inv'));show('s-quit');
  });
}
$('q-no').addEventListener('click',hideSheets);
$('q-yes').addEventListener('click',()=>gameOver('quit'));
$('r-list').addEventListener('click',e=>{ // "?" shows the details; a card is chosen with one tap, grows and glows, the others fade
  const q=e.target.closest('[data-q]');if(q){const x=run&&run.rewards&&run.rewards[+q.dataset.q];$('r-info').textContent=x?(x.s||x.t||''):'';return}
  const b=e.target.closest('.rcard'),L=$('r-list');if(!b||L.classList.contains('picked'))return;
  b.classList.add('pick');L.classList.add('picked');const a=mid(b);if(a)bits(a.x,a.y,18,['#ffe58a','#fff','#ff9ec7','#a8e6ff'],a.w*1.2,5);
  setTimeout(()=>takeReward(+b.dataset.i),REDUCED?0:380);
});
$('t-new').addEventListener('click',()=>{if(run){meta.bank+=run.gold;saveMeta()}store.del(SAVE);newRun()});
$('t-cont').addEventListener('click',()=>{if(run)resume()});
$('t-shop').addEventListener('click',()=>showShop());
$('o-shop').addEventListener('click',()=>showShop(lastFound?'gear':''));
$('o-again').addEventListener('click',newRun);
$('o-title').addEventListener('click',showTitle);
$('sh-list').addEventListener('click',e=>{const b=e.target.closest('.ucard');if(b)buy(b.dataset.k)});
$('sh-deck').addEventListener('click',e=>{const b=e.target.closest('.ucard');if(b)buy(b.dataset.k)});
$('sh-go').addEventListener('click',()=>{if(run)resume();else newRun()});
$('sh-back').addEventListener('click',showTitle);
$('tab-up').addEventListener('click',()=>{shopTab='up';renderTab(true)});
$('tab-deck').addEventListener('click',()=>{shopTab='deck';renderTab(true)});
$('tab-gear').addEventListener('click',()=>{shopTab='gear';renderTab(true)});
$('tab-skill').addEventListener('click',()=>{shopTab='skill';renderTab(true)});
$('sh-skill').addEventListener('click',e=>{const b=e.target.closest('.kcard');if(b)tapSkillShop(b.dataset.s)});
drawerIn.addEventListener('click',e=>{const b=e.target.closest('.skill');if(b)tapSkill(+b.dataset.k)});
$('s-over').addEventListener('click',e=>{if(!e.target.closest('button'))skipCount()});
$('sh-gear').addEventListener('click',e=>{const t=e.target.closest('[data-slot]');if(t){gearSlot=t.dataset.slot;info('');return renderGear()}const b=e.target.closest('.gi');if(b)tapGear(b.dataset.g)});
window.addEventListener('resize',()=>{if(run)renderBoard()});

showTitle();
})();
</script>
