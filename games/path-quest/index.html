<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PATH QUEST</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="積み木で道を作りながら、ぜんまいの騎士が草原・森・湖・雪原・おもちゃの城を旅するゲーム。おもちゃの兵隊・金貨・キャンディの積み木をどう通るかで、どこまで遠くへ行けるかが決まる。">
<meta name="theme-color" content="#fbeaf0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* layout: a toy-block land seen from above, scrolled upward as the wind-up knight walks to the flag. the status floats over the field; under it one tray holds the blocks and a row of wide buttons. one column at every width */
:root{
  color-scheme:light;
  --page:#fbeaf0;
  --card:#fffaf6;
  --ink:#4a3541;
  --dim:#735766;
  --accent:#c4467a;
  --accent-deep:#8e2f57;
  --edge:#e6c3d1;
  --sun:#ffe58a;
  --sun-deep:#f0b93a;
  --hp:#e8607e;
  --bad:rgba(232,72,98,.6);
  --foe:#d6334f;
  --deal:#e8730c;
  --gold:#a86f08;
  --heal:#2f8f5b;
  --gear:#3a6ea8;
  --ground:#cdeab3;
  --line:#b6dc98;
  --front:rgba(255,255,255,.95);
  --round:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
.app[data-area=forest]{--ground:#b9dca6;--line:#9fcb8b}
.app[data-area=lake]{--ground:#f3e6c8;--line:#e2d0a9;--front:#e27aa3}
.app[data-area=snow]{--ground:#eef3fb;--line:#d6e0f0;--front:#e27aa3}
.app[data-area=castle]{--ground:#f6dfe9;--line:#ebc6d6;--front:#c4467a}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--page);color:var(--ink)}
body{font-family:var(--round);font-weight:500;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* phone: the field edge to edge with the status floating on its top edge, the toy box's front board stuck to the bottom.
   1100px and wider: the field on the left, the box lid on the right */
.app{--slot:min(64px,calc((min(100vw,520px) - 40px)/7));--hudh:44px;position:relative;box-sizing:border-box;height:100%;max-width:520px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"field" "tray";padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

/* the field */
.field{grid-area:field;position:relative;min-height:220px;display:flex;overflow:hidden;background:var(--line)}
.view{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.track{padding:calc(var(--hudh) + 4px) 0 10px}
.board{--w:5;--h:9;position:relative;box-sizing:border-box;display:grid;grid-template-columns:repeat(var(--w),minmax(0,1fr));grid-template-rows:repeat(var(--h),minmax(0,1fr));gap:3px;padding:4px;margin:0 auto;width:100%;aspect-ratio:var(--w)/var(--h);touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cell{position:relative;min-width:0;min-height:0;background:var(--ground);border-radius:5px}
.cell svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cell.laid{background:transparent}
.cell.laid svg{overflow:visible}
.cell.front::after{content:"";position:absolute;inset:6px;border:3px dashed var(--front);border-radius:9px;pointer-events:none}
.cell.fit{background:#fff3c4}
.cell.fit::after{border:3px solid var(--sun-deep);animation:glow .9s ease-in-out infinite alternate}
.cell.over{background:var(--sun)}
.cell.new svg{animation:thunk .2s ease-out}
.app.look-b .board{gap:5px}
.app.look-b .cell:not(.laid){border-radius:11px;box-shadow:inset 0 -6px 0 rgba(74,53,65,.09),inset 0 2px 0 rgba(255,255,255,.6)}
@keyframes glow{from{opacity:.45}to{opacity:1}}
@keyframes thunk{from{transform:translateY(-12%)}to{transform:none}}

/* "can't put it there": a red blink on the cell and the block */
.cell.bad::before,.slot.bad::after{content:"";position:absolute;inset:0;z-index:4;border-radius:inherit;background:var(--bad);pointer-events:none;opacity:0;animation:blink .26s ease-in-out 4 alternate}
.slot.bad{animation:shake .3s}
@keyframes blink{from{opacity:0}to{opacity:1}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.badge{position:absolute;right:2px;bottom:3px;padding:1px 5px;border-radius:7px;background:rgba(255,255,255,.94);box-shadow:0 1px 0 rgba(74,53,65,.18);font:800 clamp(10px,2.9vw,12px)/1.25 var(--round);font-variant-numeric:tabular-nums;pointer-events:none}
.b-foe{color:var(--foe)}.b-zero{color:var(--dim)}.b-coin{color:var(--gold)}.b-heal{color:var(--heal)}.b-gear{color:var(--gear)}

.hero{position:absolute;left:0;top:0;z-index:3;pointer-events:none;transition:transform .15s linear}
.hero svg{width:100%;height:100%;display:block;overflow:visible}
.hero .key{transform-box:fill-box;transform-origin:0% 50%}
.hero.walk svg{animation:bob .17s ease-in-out infinite alternate}
.hero.walk .key{animation:wind .34s linear infinite}
.hero.hurt svg{animation:hurt .3s ease-out}
@keyframes bob{to{transform:translateY(-5%)}}
@keyframes wind{50%{transform:scaleX(.25)}}
@keyframes hurt{30%{transform:translateX(-7%);filter:drop-shadow(0 0 5px var(--bad))}70%{transform:translateX(7%);filter:drop-shadow(0 0 5px var(--bad))}}

.pop{position:absolute;z-index:5;pointer-events:none;transform:translate(-50%,0);font:800 20px/1 var(--round);font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 2px 0 #fff;animation:rise .95s ease-out forwards}
.p-deal{color:var(--deal)}.p-hurt{color:var(--foe)}.p-guard{color:var(--dim)}.p-gold{color:var(--gold)}.p-heal{color:var(--heal)}.p-gear{color:var(--gear)}
@keyframes rise{from{transform:translate(-50%,4px) scale(.7)}20%{transform:translate(-50%,-6px) scale(1.15)}to{transform:translate(-50%,-32px);opacity:0}}

/* status: one thin row floating on the field with a white halo. hp is a row of ten little blocks; while a block is held, the part it would cost blinks pale */
.hud{position:absolute;top:0;left:0;right:0;z-index:6;pointer-events:none;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 4px #fff;box-sizing:border-box;height:var(--hudh);display:flex;align-items:center;gap:10px;padding:0 6px 0 10px;font:800 15px/1 var(--round);font-variant-numeric:tabular-nums;white-space:nowrap}
.hud svg{width:20px;height:20px;flex:none;display:block}
.gear svg,.hp>span>svg{filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1px #fff)}
.hp{display:flex;align-items:center;gap:5px;min-width:0}
.hp.dying b{color:var(--foe)}
.blocks{display:flex;gap:2px}
.blocks i{position:relative;width:10px;height:15px;border-radius:3px;background:#f6d3dc;box-shadow:0 0 0 1.5px #fff;overflow:hidden}
.blocks u,.blocks s{position:absolute;top:0;bottom:0;left:0}
.blocks u{background:var(--hp)}
.blocks s{background:#fff;animation:lose .45s ease-in-out infinite alternate}
@keyframes lose{from{opacity:.2}to{opacity:.8}}
.gear{display:flex;align-items:center;gap:9px;margin-left:auto}
.gear span{display:flex;align-items:center;gap:2px}
.gear .g b{color:var(--gold)}
.quit{position:relative;flex:none;pointer-events:auto;width:38px;height:38px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 2px 0 var(--edge);cursor:pointer}
.hud .quit svg{position:absolute;inset:0;width:100%;height:100%}
.quit .ring circle{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:107;stroke-dashoffset:107;transform:rotate(-90deg);transform-origin:50% 50%}
.quit.hold .ring circle{animation:hold .65s linear forwards}
.quit:active{transform:translateY(2px);box-shadow:0 0 0 var(--edge)}
.quit:disabled{opacity:.4;cursor:default}
@keyframes hold{to{stroke-dashoffset:0}}

/* the tray: the front board of the toy box. blocks keep one size whether there are 4 or 6; the die sits at the right end and is the one loud thing */
.tray{grid-area:tray;position:relative;display:flex;align-items:center;gap:8px;padding:12px 6px 10px;background:var(--card);border-top:7px solid var(--edge);box-shadow:inset 0 2px 0 #fff;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.hand{--hs:4;flex:1;display:grid;grid-template-columns:repeat(var(--hs),var(--slot));justify-content:center;gap:4px}
.slot{position:relative;aspect-ratio:1;max-width:100%;border-radius:13px;cursor:grab;transition:transform .1s}
.slot svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.slot .badge{right:2px;bottom:5px;font-size:11px}
.slot.sel{transform:translateY(-8px)}
.slot.sel::before{content:"";position:absolute;inset:-4px;border:3px solid var(--accent);border-radius:16px}
.slot.dull{opacity:.45;filter:saturate(.4)}
.slot.none{box-sizing:border-box;border:2px dashed var(--edge);cursor:default}
.slot.deal{animation:deal .3s ease-out backwards}
.slot.deal:nth-child(2){animation-delay:.04s}.slot.deal:nth-child(3){animation-delay:.08s}.slot.deal:nth-child(4){animation-delay:.12s}.slot.deal:nth-child(5){animation-delay:.16s}.slot.deal:nth-child(6){animation-delay:.2s}
@keyframes deal{from{transform:translateY(40%) scale(.7);opacity:0}}
.dice{position:relative;flex:none;width:var(--slot);height:var(--slot);padding:0;border:0;border-radius:14px;background:var(--accent);box-shadow:0 4px 0 var(--accent-deep);cursor:pointer}
.dice svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.dice b{position:absolute;top:-8px;right:-4px;min-width:22px;height:22px;box-sizing:border-box;padding:0 6px;border-radius:11px;background:#fff;box-shadow:0 2px 0 var(--edge);font:800 13px/22px var(--round);font-variant-numeric:tabular-nums;color:var(--accent)}
.dice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.dice:disabled{background:#dccbd2;box-shadow:none;transform:translateY(3px);cursor:default}
.dice:disabled b{color:var(--dim)}
.dice.hint{animation:nudge .9s ease-in-out infinite}
@keyframes nudge{50%{transform:scale(1.08)}}

.ghost-tile{position:fixed;left:0;top:0;z-index:30;width:66px;height:66px;margin:-86px 0 0 -33px;pointer-events:none;filter:drop-shadow(0 10px 8px rgba(74,53,65,.3))}
.ghost-tile svg{width:100%;height:100%;display:block}

/* buttons are blocks too */
.btn{padding:13px 16px;border:0;border-radius:14px;background:#fff;box-shadow:0 4px 0 var(--edge);font:800 16px/1.2 var(--round);color:var(--ink);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn.main{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-deep)}
.btn.main:active{box-shadow:0 1px 0 var(--accent-deep)}
.btn.link{padding:10px 4px;background:transparent;box-shadow:none;font-weight:500;color:var(--dim);text-decoration:underline;text-underline-offset:3px}
.btn:disabled{opacity:.4;cursor:default}

/* sheets */
.sheet{position:fixed;inset:0;z-index:20;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:rgba(74,53,65,.45);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet.solid{background:var(--page)}
.card{box-sizing:border-box;width:min(100%,380px);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:22px 18px 20px;border-radius:20px;background:var(--card);box-shadow:0 6px 0 var(--edge)}
.card h2{margin:0;font:800 22px/1.3 var(--round);text-wrap:balance}
.card p{margin:0;font-size:15px;line-height:1.6;color:var(--dim);white-space:pre-line}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:8px 12px;border:0;border-radius:14px;background:#fff;box-shadow:0 3px 0 #ecd2dc;text-align:left;cursor:pointer}
.choice svg{width:44px;height:44px;display:block}
.choice b{display:block;font:800 16px/1.3 var(--round)}
.choice small{display:block;margin-top:2px;font-size:12px;color:var(--dim)}
.choice .cost{font:800 15px/1 var(--round);color:var(--gold);white-space:nowrap}
.choice:active{transform:translateY(2px);box-shadow:0 1px 0 #ecd2dc}
.choice:disabled{opacity:.45;cursor:default;transform:none}
.pips{display:inline-flex;gap:3px;margin-left:6px;vertical-align:2px}
.pips i{width:7px;height:7px;border-radius:2px;background:#ecd2dc}
.pips i.on{background:var(--accent)}
.bank{font-weight:800;color:var(--gold)}

.title{display:flex;flex-direction:column;align-items:center;gap:16px;width:min(100%,360px)}
.logo{margin:0;display:flex;flex-direction:column;align-items:center;gap:7px}
.logo span{display:flex;gap:6px}
.logo i{display:grid;place-items:center;width:clamp(40px,12.5vw,54px);aspect-ratio:1;border-radius:11px;box-shadow:inset 0 -6px 0 rgba(74,53,65,.13);font:800 clamp(23px,7.4vw,32px)/1 var(--round);font-style:normal;color:var(--ink)}
.c0{background:#f7c3d4}.c1{background:#bfe6d6}.c2{background:#fbe2a0}.c3{background:#d8cdf6}.c4{background:#c4e2f5}
.lead{margin:0;font-size:15px;line-height:1.5;color:var(--dim);text-align:center}
.demo{box-sizing:border-box;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:4px;width:168px;border-radius:14px;background:var(--line)}
.demo .cell{aspect-ratio:1}
.title .btn{width:100%}
.record{min-height:14px;font-size:14px;color:var(--dim)}

/* wide screens: the field fills the left, the box lid on the right holds the status, the blocks in rows of three and the die */
@media (min-width:1100px){
  .app{--slot:96px;max-width:1080px;padding:24px 32px;column-gap:28px;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"field hud" "field tray" "field ."}
  .field{border-radius:22px;box-shadow:inset 0 0 0 5px rgba(74,53,65,.07)}
  .track{padding:10px 6px 14px}
  .hud{grid-area:hud;position:static;height:auto;flex-wrap:wrap;gap:16px;padding:22px 22px 12px;border-radius:24px 24px 0 0;background:var(--card);text-shadow:none;pointer-events:auto;font-size:22px}
  .hud svg{width:28px;height:28px}
  .gear svg,.hp>span>svg{filter:none}
  .hp{flex:1 0 100%;gap:8px}
  .blocks{gap:4px}
  .blocks i{width:18px;height:26px;border-radius:5px;box-shadow:none}
  .gear{margin-left:0;gap:20px}
  .gear span{gap:5px}
  .quit{margin-left:auto;width:48px;height:48px}
  .tray{flex-direction:column;gap:18px;padding:14px 22px 24px;border-top:0;border-radius:0 0 24px 24px;box-shadow:0 8px 0 var(--edge)}
  .hand{flex:none;grid-template-columns:repeat(3,var(--slot));gap:12px}
  .slot .badge{font-size:14px}
  .dice{width:84px;height:84px;border-radius:20px;box-shadow:0 6px 0 var(--accent-deep)}
  .dice b{min-width:28px;height:28px;border-radius:14px;font-size:16px;line-height:28px}
  .badge{font-size:15px}
  .pop{font-size:28px}
}

@media (prefers-reduced-motion:reduce){
  .hero,.slot{transition:none}
  .hero.walk svg,.hero.walk .key,.cell.fit::after,.dice.hint,.slot.deal{animation:none}
  .blocks s{animation:none;opacity:.6}
  .cell.new svg,.pop,.hero.hurt svg{animation-duration:.01s}
}
</style>
</head>
<body>
<div class="app look-a" id="app" data-area="grass">
  <div class="hud">
    <div class="hp" id="hp" aria-label="体力"><span id="hpicon"></span><span class="blocks" id="hpblocks"></span><b id="hptext">10/10</b></div>
    <div class="gear"><span id="i-atk" aria-label="攻撃"></span><span id="i-def" aria-label="守り"></span><span class="g" id="i-gold" aria-label="金貨"></span></div>
    <button class="quit" id="quit" type="button" aria-label="帰還（長押しですぐ帰る）"><svg class="ring" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17"/></svg><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M13.5 29V18a6.5 6.5 0 0 1 13 0v11z" fill="#e6b98e" stroke="#b08968" stroke-width="2" stroke-linejoin="round"/><path d="M20 12v17" stroke="#b08968" stroke-width="1.5"/><circle cx="23" cy="22" r="1.6" fill="#f2c14e"/><path d="M10.5 29.5h19" stroke="#b08968" stroke-width="2.5" stroke-linecap="round"/></svg></button>
  </div>
  <div class="field">
    <div class="view" id="view"><div class="track"><div class="board" id="board" aria-label="積み木の国の地図"></div></div></div>
  </div>
  <div class="tray">
    <div class="hand" id="hand"></div>
    <button class="dice" id="roll" type="button" aria-label="リロール。積み木を全部まぜて引き直す"><span id="rollicon"></span><b id="rolln">3</b></button>
  </div>
</div>

<div class="sheet solid" id="s-title">
  <div class="title">
    <h1 class="logo" aria-label="PATH QUEST"><span><i class="c0">P</i><i class="c1">A</i><i class="c2">T</i><i class="c3">H</i></span><span><i class="c4">Q</i><i class="c0">U</i><i class="c1">E</i><i class="c2">S</i><i class="c3">T</i></span></h1>
    <p class="lead">光るマスに積み木を置いて、<br>旗まで道をつなごう</p>
    <div class="demo" id="demo"></div>
    <button class="btn main" id="t-new" type="button">冒険に出る</button>
    <button class="btn" id="t-cont" type="button" hidden>つづきから</button>
    <button class="btn" id="t-shop" type="button">強化する</button>
    <div class="record" id="t-best"></div>
  </div>
</div>

<div class="sheet" id="s-reward" hidden>
  <div class="card">
    <h2 id="r-head">草原 1 クリア</h2>
    <p>ごほうびをひとつえらぶ</p>
    <div class="choices" id="r-list"></div>
  </div>
</div>

<div class="sheet" id="s-quit" hidden>
  <div class="card">
    <h2>帰還する？</h2>
    <p id="q-text"></p>
    <div class="row"><button class="btn main" id="q-no" type="button">つづける</button><button class="btn" id="q-yes" type="button">帰還する</button></div>
  </div>
</div>

<div class="sheet" id="s-over" hidden>
  <div class="card">
    <h2 id="o-head"></h2>
    <p id="o-text"></p>
    <div class="row"><button class="btn main" id="o-shop" type="button">強化する</button><button class="btn" id="o-again" type="button">もう一度旅に出る</button></div>
    <button class="btn link" id="o-title" type="button">タイトルへ</button>
  </div>
</div>

<div class="sheet" id="s-shop" hidden>
  <div class="card">
    <h2>強化</h2>
    <p>持ち帰った金貨 <span class="bank" id="sh-bank">0</span></p>
    <div class="choices" id="sh-list"></div>
    <div class="row"><button class="btn main" id="sh-go" type="button">冒険に出る</button><button class="btn" id="sh-back" type="button">もどる</button></div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const SAVE='pathquest.run.v2', META='pathquest.meta.v1';
const store={
  get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};

/* ---------- geometry ---------- */
const W=5;
const DIRS=[[-1,0,1],[0,1,2],[1,0,4],[0,-1,8]]; // N E S W as bits 1 2 4 8
const BITS=[1,2,4,8];
const OPP={1:4,2:8,4:1,8:2};
const SHAPES=[[5,22],[10,8],[3,9],[6,9],[12,9],[9,9],[11,4],[7,6],[14,4],[13,6],[15,6]]; // tilted toward N-S because the knight walks upward
const SHAPE_NAME=m=>({5:'まっすぐ',10:'まっすぐ',15:'十字'})[m]||([3,6,12,9].includes(m)?'カーブ':'T字');
const rnd=n=>Math.floor(Math.random()*n);

function roadSVG(m,sh,lo,hi){ // on the field the road runs past the block into the gap (lo -4, hi 104); in the tray it stops at the block's edge

}

function evSVG(e){

const FOES=[

function makeFoe(f){
  const pool=FOES.filter(x=>x.from<=f);
  const t=pool.length>1&&Math.random()<.55?pool[pool.length-1]:pool[rnd(pool.length)];
  return {k:'foe',t:t.t,name:t.name,hp:Math.max(2,2+f+t.hp),atk:Math.max(1,1+Math.floor((f-1)/2)+t.atk),gold:3+Math.floor(f*.8)};
}
function makeBoss(f){return {k:'foe',t:'boss',name:'兵隊長',hp:4+Math.round(f*1.6),atk:1+Math.ceil(f/2),gold:10+2*f,boss:true}}
function makeEvent(f){
  const x=Math.random(),fp=Math.min(.3,.16+.012*f);
  if(x<fp)return makeFoe(f);
  if(x<fp+.13)return {k:'coin',v:2+Math.floor(f/2)};
  if(x<fp+.2)return {k:'potion',v:3+Math.floor(f/3)};
  if(x<fp+.245)return {k:'sword'};
  if(x<fp+.29)return {k:'shield'};
  return null;
}
const makeTile=(f,m)=>({m:m||pickW(SHAPES),e:makeEvent(f),c:rnd(BLOCKS.length)});

const heightFor=f=>f<=2?7:f<=5?9:f<=9?11:13;
function nbr(i,b,h){const r=i/W|0,c=i%W,d=DIRS[BITS.indexOf(b)],rr=r+d[0],cc=c+d[1];return rr<0||rr>=h||cc<0||cc>=W?-1:rr*W+cc}
function dirBit(a,b){return b===a-W?1:b===a+1?2:b===a+W?4:8}
function findPath(cells,h,s,g){
  const N=W*h,wt=Array.from({length:N},()=>1+Math.random()*1.6),dist=new Array(N).fill(Infinity),prev=new Array(N).fill(-1),done=new Array(N).fill(false);
  dist[s]=0;
  for(;;){
    let u=-1,best=Infinity;
    for(let i=0;i<N;i++)if(!done[i]&&dist[i]<best){best=dist[i];u=i}
    if(u<0||u===g)break;
    done[u]=true;
    for(const b of BITS){const v=nbr(u,b,h);if(v<0||done[v]||cells[v].rock)continue;const nd=dist[u]+wt[v];if(nd<dist[v]){dist[v]=nd;prev[v]=u}}
  }
  if(dist[g]===Infinity)return null;
  const p=[];for(let v=g;v!==-1;v=prev[v])p.push(v);return p.reverse();
}
function genFloor(){
  const f=run.floor,h=heightFor(f);
  let cells,s,g,path;
  for(let tries=0;tries<60;tries++){
    cells=Array.from({length:W*h},()=>({rock:0,gem:0,tile:null}));
    s=(h-1)*W+2;g=rnd(W);
    const rocks=Math.floor(W*h*.08)+Math.floor(f/4);
    for(let k=0,guard=0;k<rocks&&guard<300;guard++){const i=rnd(W*h);if(i===s||i===g||i===s-W||cells[i].rock)continue;cells[i].rock=1;k++}
    path=findPath(cells,h,s,g);
    if(path)break;
  }
  if(!path){cells.forEach(c=>{c.rock=0});path=findPath(cells,h,s,g)}
  const free=[];cells.forEach((c,i)=>{if(!c.rock&&i!==s&&i!==g&&i!==s-W)free.push(i)});
  shuffle(free).slice(0,f>=6?2:1).forEach(i=>{cells[i].gem=5+2*f});
  const deck=[];
  for(let k=1;k<path.length-1;k++)deck.push(makeTile(f,dirBit(path[k],path[k-1])|dirBit(path[k],path[k+1])));
  const total=deck.length+18+2*meta.up.bag+run.extra;
  while(deck.length<total)deck.push(makeTile(f));
  shuffle(deck);
  Object.assign(run,{h,cells,s,g,at:s,boss:f%5===0?makeBoss(f):null,hand:deck.splice(0,run.handSize),deck,rolls:3+meta.up.roll,target:-1});
  sel=-1;
}

/* ---------- connections ---------- */
const maskOf=i=>i===run.s||i===run.g?15:(run.cells[i].tile?run.cells[i].tile.m:0);
function bfs(from){
  const prev=new Map([[from,-1]]),q=[from];
  while(q.length){
    const i=q.shift();
    if(i===run.g&&i!==from)continue;
    const m=maskOf(i);
    for(const b of BITS){
      if(!(m&b))continue;
      const j=nbr(i,b,run.h);if(j<0||prev.has(j))continue;
      if(!(maskOf(j)&OPP[b]))continue;
      prev.set(j,i);q.push(j);
    }
  }
  return prev;
}
function pathTo(a,b){
  const prev=bfs(a);if(!prev.has(b))return null;
  const p=[];for(let v=b;v!==-1;v=prev.get(v))p.push(v);return p.reverse();
}
function frontier(){
  const net=bfs(run.s),map=new Map();
  for(const i of net.keys()){
    if(i===run.g)continue;
    const m=maskOf(i);
    for(const b of BITS){
      if(!(m&b))continue;
      const j=nbr(i,b,run.h);
      if(j<0||j===run.g||j===run.s)continue;
      const c=run.cells[j];if(c.rock||c.tile)continue;
      map.set(j,(map.get(j)||0)|OPP[b]);
    }
  }
  return map;
}
const fits=(t,j,F)=>!!t&&F.has(j)&&!!(t.m&F.get(j));
const anyFit=(t,F)=>{if(!t)return false;for(const j of F.keys())if(t.m&F.get(j))return true;return false};

/* ---------- rendering ---------- */
const app=$('app'),view=$('view'),board=$('board'),handEl=$('hand'),rollBtn=$('roll');
const hero=document.createElement('div');hero.className='hero';hero.innerHTML=svg(SPR.hero);
$('hpicon').innerHTML=ico(SPR.heart);
$('rollicon').innerHTML=svg('<path d="M20 12h60" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".45"/>'+[[31,31],[69,31],[50,50],[31,69],[69,69]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="8.5" fill="#fff"/>`).join(''));
function badge(e){
  if(!e)return '';
  if(e.k==='foe'){const d=dmgFor(e);return `<span class="badge ${d?'b-foe':'b-zero'}">-${d}</span>`}
  if(e.k==='coin')return `<span class="badge b-coin">+${e.v}</span>`;
  if(e.k==='potion')return `<span class="badge b-heal">+${e.v}</span>`;
  if(e.k==='sword')return '<span class="badge b-gear">攻+1</span>';
  if(e.k==='shield')return '<span class="badge b-gear">守+1</span>';
  return '';
}
function cellHTML(i,F){
  const c=run.cells[i];let cls='cell',inner='',tab='';
  if(i===run.s){cls+=' start';inner=svg(SPR.start)}
  else if(i===run.g){cls+=' goal';inner=run.boss?svg(`<g transform="translate(36 -4) scale(.6)">${FLAG}</g>`+SPR.boss)+badge(run.boss):svg(FLAG)}
  else if(c.rock){cls+=' rock';inner=svg(SPR.ob[areaOf(run.floor).k])}
  else if(c.tile){cls+=' laid'+(i===justPlaced?' new':'');inner=svg(tileArt(c.tile))+badge(c.tile.e)}
  else{
    inner=svg(deco(i)+(c.gem?SPR.gem:''));
    if(F&&F.has(i)){cls+=' front'+(sel>=0&&fits(run.hand[sel],i,F)?' fit':'');tab=' tabindex="0" role="button" aria-label="道の先"'}
  }
  return `<div class="${cls}" data-i="${i}"${tab}>${inner}</div>`;
}
function renderBoard(F){
  F=F||frontier();
  board.style.setProperty('--h',run.h);
  let h='';for(let i=0;i<W*run.h;i++)h+=cellHTML(i,F);
  board.innerHTML=h;board.appendChild(hero);justPlaced=-1;
  placeHero(run.at,true);
}
function refreshMarks(){
  const F=frontier();
  for(const [j] of F){const el=board.children[j];if(el)el.classList.toggle('fit',sel>=0&&fits(run.hand[sel],j,F))}
}
function updateCell(i){const el=board.children[i];if(el&&el!==hero)el.outerHTML=cellHTML(i,null)}
function renderHand(F){
  F=F||frontier();
  handEl.style.setProperty('--hs',run.hand.length);
  handEl.innerHTML=run.hand.map((t,i)=>t?`<div class="slot${i===sel?' sel':''}${anyFit(t,F)?'':' dull'}" data-i="${i}" tabindex="0" role="button" aria-label="${tileName(t)}">${svg(tileArt(t,true))}${badge(t.e)}</div>`:`<div class="slot none" data-i="${i}"></div>`).join('');
}
let preview=0; // the hp the held block would cost
function renderHp(){
  const hp=Math.max(0,run.hp),m=run.maxHp,after=Math.max(0,hp-preview),part=(v,k)=>Math.min(1,Math.max(0,v/m*10-k));
  let h='';
  for(let k=0;k<10;k++){const f=part(hp,k),a=part(after,k);h+=`<i><u style="width:${f*100}%"></u>${f>a?`<s style="left:${a*100}%;width:${(f-a)*100}%"></s>`:''}</i>`}
  $('hpblocks').innerHTML=h;
  $('hptext').textContent=`${hp}/${m}`;
  $('hp').classList.toggle('dying',preview>0&&preview>=hp);
}
function previewFor(hi,j){ // the toy on the block, plus the captain when this block finishes the road to the flag
  const t=run.hand[hi];if(!t)return 0;
  let d=t.e&&t.e.k==='foe'?dmgFor(t.e):0;
  if(j>=0&&run.boss&&fits(t,j,frontier())){run.cells[j].tile=t;const done=bfs(run.s).has(run.g);run.cells[j].tile=null;if(done)d+=dmgFor(run.boss)}
  return d;
}
function setPreview(j){const d=sel>=0&&run&&run.phase==='build'?previewFor(sel,j):0;if(d!==preview){preview=d;renderHp()}}
function renderStats(){
  if(sel<0)preview=0;
  app.dataset.area=areaOf(run.floor).k;
  renderHp();
  $('i-atk').innerHTML=ico(SPR.sword)+`<b>${run.atk}</b>`;
  $('i-def').innerHTML=ico(SPR.shield)+`<b>${run.def}</b>`;
  $('i-gold').innerHTML=ico(SPR.coin)+`<b>${run.gold}</b>`;
  $('rolln').textContent=run.rolls;
  rollBtn.disabled=busy||run.phase!=='build'||run.rolls<=0;
  $('quit').disabled=busy;
}
function markStuck(F){rollBtn.classList.toggle('hint',run.phase==='build'&&!busy&&run.rolls>0&&!run.hand.some(t=>anyFit(t,F)))}
function render(){const F=frontier();renderStats();renderBoard(F);renderHand(F);markStuck(F)}
function placeHero(i,instant){
  const el=board.children[i];if(!el||el===hero)return;
  if(instant)hero.style.transition='none';
  hero.style.width=el.offsetWidth+'px';hero.style.height=el.offsetHeight+'px';
  hero.style.transform=`translate(${el.offsetLeft}px,${el.offsetTop}px)`;
  if(instant){void hero.offsetWidth;hero.style.transition=''}
}
function follow(i,smooth){
  const el=board.children[i];if(!el)return;
  const top=board.offsetTop+el.offsetTop+el.offsetHeight/2-view.clientHeight*.62;
  view.scrollTo({top:Math.max(0,top),behavior:smooth&&!REDUCED?'smooth':'auto'});
}
function pop(i,text,cls,delay){ // a number over a cell's head
  setTimeout(()=>{
    const el=board.children[i];if(!el)return;
    const p=document.createElement('span');p.className='pop '+cls;p.textContent=text;
    p.style.left=(el.offsetLeft+el.offsetWidth/2+(Math.random()*16-8))+'px';p.style.top=(el.offsetTop-4)+'px';
    board.appendChild(p);setTimeout(()=>p.remove(),1000);
  },delay||0);
}
function flash(el){if(!el)return;el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),1150)}
const flashCell=i=>{if(i>=0)flash(board.children[i])};
const flashSlot=i=>{if(i>=0)flash(handEl.children[i])};
function hop(){if(REDUCED)return;[...handEl.children].forEach((s,k)=>s.animate([{transform:'none'},{transform:'translateY(-10px)'},{transform:'none'}],{duration:280,delay:k*35}))}
function lunge(dx,dy){if(!REDUCED)hero.firstElementChild.animate([{transform:'none'},{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:200,easing:'ease-out'})}
function struck(el){const s=el&&el.firstElementChild;if(s&&!REDUCED)s.animate([{transform:'none'},{transform:'translateX(7%)',filter:'brightness(1.35)'},{transform:'translateX(-7%)'},{transform:'none'}],{duration:220})}
function hurt(){hero.classList.remove('hurt');void hero.offsetWidth;hero.classList.add('hurt')}
function tileName(t){
  const e=t.e,s=SHAPE_NAME(t.m);
  if(!e)return `${s}の積み木`;
  return `${s}の積み木・`+(e.k==='foe'?e.name:({coin:'金貨',potion:'キャンディ',sword:'剣',shield:'盾'})[e.k]);
}

/* ---------- actions ---------- */
function tapSlot(i){
  const t=run.hand[i];if(!t)return;
  if(sel!==i&&!anyFit(t,frontier()))return flashSlot(i);
  sel=sel===i?-1:i;
  renderHand();refreshMarks();setPreview(-1);
}
function tapCell(i){
  if(sel<0){if(frontier().has(i))hop();return}
  place(i,sel);
}
function place(j,hi){
  if(busy||!run||run.phase!=='build')return;
  const t=run.hand[hi];
  if(!t)return;
  if(!fits(t,j,frontier())){flashCell(j);flashSlot(hi);return}
  run.cells[j].tile=t;run.hand[hi]=run.deck.length?run.deck.shift():null;sel=-1;justPlaced=j;
  run.phase='walk';run.target=j;save(); // saved before the walk, so reloading mid-walk replays it instead of undoing it
  proceed();
}
async function proceed(){
  busy=true;render();
  if(!await walkTo(run.target))return;
  if(bfs(run.s).has(run.g)){
    if(!await walkTo(run.g))return;
    await sleep(350);busy=false;
    run.phase='reward';run.rewards=pickRewards();save();return showReward();
  }
  busy=false;run.phase='build';render();afterAction();
}
async function walkTo(target){
  const path=pathTo(run.at,target)||[run.at,target];
  for(let k=1;k<path.length;k++){
    const i=path[k],c=run.cells[i];
    const foe=i===run.g?run.boss:(c.tile&&c.tile.e&&c.tile.e.k==='foe'?c.tile.e:null);
    if(foe){ // fight from the cell in front of the toy
      hero.classList.remove('walk');
      if(!await battle(foe,run.at,i)){await sleep(800);busy=false;gameOver('hp');return false}
      if(i===run.g)run.boss=null;else c.tile.e=null;
      updateCell(i);await sleep(STEP);
    }
    hero.classList.add('walk');
    run.at=i;placeHero(i);follow(i,true);
    await sleep(STEP);
    if(resolve(i)){renderStats();hero.classList.remove('walk');await sleep(STEP*2)}
  }
  hero.classList.remove('walk');
  return true;
}
async function battle(e,at,i){
  const hEl=board.children[at],eEl=board.children[i];
  const back=Math.max(0,e.atk-run.def),rounds=roundsOf(e);
  const gap=REDUCED?80:rounds<=4?340:Math.max(170,1400/rounds);
  const dx=(eEl.offsetLeft-hEl.offsetLeft)*.3,dy=(eEl.offsetTop-hEl.offsetTop)*.3;
  follow(at,true);await sleep(REDUCED?0:140);
  for(let r=0;r<rounds;r++){
    run.hp-=back; // the toy hits
    pop(at,back?`-${back}`:'0',back?'p-hurt':'p-guard');if(back)hurt();
    renderStats();
    if(run.hp<=0)return false;
    await sleep(gap/2);
    lunge(dx,dy);struck(eEl);pop(i,`-${run.atk}`,'p-deal'); // the knight hits
    await sleep(gap/2);
  }
  run.gold+=e.gold;pop(i,`+${e.gold}`,'p-gold');renderStats();
  await sleep(REDUCED?0:200);
  return true;
}
function resolve(i){
  const c=run.cells[i];if(!c||!c.tile)return false;
  let hit=false;const e=c.tile.e;
  if(e&&e.k!=='foe'){
    c.tile.e=null;hit=true;
    if(e.k==='coin'){run.gold+=e.v;pop(i,`+${e.v}`,'p-gold')}
    else if(e.k==='potion'){const h=Math.min(e.v,run.maxHp-run.hp);run.hp+=h;pop(i,`+${h}`,'p-heal')}
    else if(e.k==='sword'){run.atk++;pop(i,'攻+1','p-gear')}
    else if(e.k==='shield'){run.def++;pop(i,'守+1','p-gear')}
  }
  if(c.gem&&run.hp>0){const v=c.gem;c.gem=0;run.gold+=v;pop(i,`+${v}`,'p-gold',e?420:0);hit=true}
  if(hit)updateCell(i);
  return hit;
}
function reroll(){
  if(busy||!run||run.phase!=='build'||run.rolls<=0)return;
  run.deck.push(...run.hand.filter(Boolean));shuffle(run.deck);
  run.hand=run.hand.map(()=>run.deck.length?run.deck.shift():null);
  run.rolls--;sel=-1;render();
  [...handEl.children].forEach(s=>s.classList.add('deal'));
  afterAction();
}
async function afterAction(){
  const F=frontier();
  let why='';
  if(!F.size){why='dead';flashCell(run.at)}
  else if(run.hand.every(x=>!x))why='empty';
  else if(run.rolls<=0&&!run.hand.some(t=>anyFit(t,F))){why='nofit';run.hand.forEach((t,i)=>{if(t)flashSlot(i)})}
  markStuck(F);
  if(!why)return save();
  busy=true;renderStats();await sleep(1200);busy=false;gameOver(why);
}

/* ---------- rewards ---------- */
function pickRewards(){
  const f=run.floor,heal=5+Math.floor(f/2),g=6+2*f;
  let pool=[
    {k:'heal',icon:'potion',t:`HPを${heal}回復`,s:`いま ${Math.max(0,run.hp)}/${run.maxHp}`,v:heal},
    {k:'maxhp',icon:'heart',t:'最大HP+3',s:'HPも3ふえる',v:3},
    {k:'atk',icon:'sword',t:'攻撃+1',s:`いま ${run.atk}`},
    {k:'def',icon:'shield',t:'守り+1',s:`いま ${run.def}`},
    {k:'deck',icon:'bag',t:'積み木+3',s:'次のステージから'},
    {k:'gold',icon:'coin',t:`金貨+${g}`,s:'持ち帰って強化に使える',v:g}
  ];
  if(run.hp>=run.maxHp)pool=pool.filter(x=>x.k!=='heal');
  return shuffle(pool).slice(0,3);
}
function showReward(){
  $('r-head').textContent=`${placeName(run.floor)} クリア`;
  $('r-list').innerHTML=run.rewards.map((x,i)=>`<button class="choice" type="button" data-i="${i}">${svg(SPR[x.icon])}<span><b>${x.t}</b><small>${x.s}</small></span><span></span></button>`).join('');
  renderStats();show('s-reward');
}
function takeReward(i){
  const x=run.rewards[i];if(!x)return;
  if(x.k==='heal')run.hp=Math.min(run.maxHp,run.hp+x.v);
  if(x.k==='maxhp'){run.maxHp+=3;run.hp+=3}
  if(x.k==='atk')run.atk++;
  if(x.k==='def')run.def++;
  if(x.k==='deck')run.extra+=3;
  if(x.k==='gold')run.gold+=x.v;
  run.rewards=null;nextFloor();
}

/* ---------- end of run ---------- */
function gameOver(why){
  if(!run)return;
  meta.bank+=run.gold;meta.best=Math.max(meta.best,run.floor);saveMeta();
  const p=placeName(run.floor);
  const head={hp:`${p}で力つきた`,dead:`${p}で行き止まり`,nofit:`${p}で道がとぎれた`,empty:`${p}で積み木がなくなった`,quit:`${p}から帰還した`};
  const note={dead:'道の先に置ける所がなくなった。\n',nofit:'つながる積み木がなく、リロールものこっていなかった。\n',empty:'積み木を使いきった。\n'};
  $('o-head').textContent=head[why]||head.quit;
  $('o-text').textContent=`${note[why]||''}持ち帰った金貨 ${run.gold}\nいちばん遠く ${placeName(meta.best)}`;
  store.del(SAVE);run=null;busy=false;
  hideSheets();show('s-over');
}

/* ---------- sheets ---------- */
const SHEETS=['s-title','s-reward','s-quit','s-over','s-shop'];
function hideSheets(){SHEETS.forEach(id=>$(id).hidden=true)}
function show(id){hideSheets();$(id).hidden=false;const b=$(id).querySelector('button:not([hidden])');if(b&&matchMedia('(hover:hover)').matches)b.focus({preventScroll:true})}
function showTitle(){
  const B=(c,m,e)=>blockSVG(c)+roadSVG(m,BLOCKS[c][1])+e;
  const demo=['',SPR.ob.grass,FLAG, SPR.gem,B(0,6,SPR.soldier),B(2,9,SPR.sword), '',B(1,5,SPR.coin),'', '',SPR.start+SPR.hero,''];
  const laid=[4,5,7];
  $('demo').innerHTML=demo.map((s,i)=>`<div class="cell${laid.includes(i)?' laid':''}">${s?svg(s):''}</div>`).join('');
  $('t-cont').hidden=!run;
  if(run)$('t-cont').textContent=`つづきから　${placeName(run.floor)}`;
  $('t-shop').textContent=`強化する　金${meta.bank}`;
  $('t-best').textContent=meta.best?`いちばん遠く ${placeName(meta.best)}`:'';
  show('s-title');
}
function showShop(){
  $('sh-bank').textContent=meta.bank;
  $('sh-list').innerHTML=UPS.map(u=>{
    const l=meta.up[u.k],maxed=l>=u.max,c=u.cost(l);
    const pips=u.max>1?`<span class="pips">${Array.from({length:u.max},(_,j)=>`<i class="${j<l?'on':''}"></i>`).join('')}</span>`:'';
    return `<button class="choice" type="button" data-k="${u.k}"${maxed||meta.bank<c?' disabled':''}>${svg(SPR[u.icon])}<span><b>${u.name}${pips}</b><small>${u.desc}</small></span><span class="cost">${maxed?'最大':'金'+c}</span></button>`;
  }).join('');
  show('s-shop');
}
function buy(k){
  const u=UPS.find(x=>x.k===k);if(!u)return;
  const l=meta.up[k],c=u.cost(l);
  if(l>=u.max||meta.bank<c)return;
  meta.bank-=c;meta.up[k]++;saveMeta();showShop();
}
function resume(){
  hideSheets();
  if(run.phase==='reward'&&run.rewards){render();follow(run.at,false);return showReward()}
  if(run.phase==='walk'&&run.target>=0){follow(run.at,false);return proceed()}
  run.phase='build';busy=false;render();follow(run.at,false);afterAction();
}

/* ---------- input: one pointer path for tap and drag (touch, pen, mouse) ---------- */
let drag=null,ghost=null,overCell=-1;
function cellUnder(x,y){const el=document.elementFromPoint(x,y),c=el&&el.closest('.cell');return c&&board.contains(c)?+c.dataset.i:-1}
const LIFT=53; // the ghost block floats this far above the finger (.ghost-tile margin-top -86px, height 66px)
function dropCell(x,y){ // the cell under the floating block wins; the cell under the finger is the fallback
  const F=frontier(),t=run.hand[sel],up=cellUnder(x,y-LIFT),at=cellUnder(x,y);
  if(fits(t,up,F))return up;if(fits(t,at,F))return at;return up>=0?up:at;
}
function setOver(i){
  if(overCell===i)return;
  if(overCell>=0&&board.children[overCell])board.children[overCell].classList.remove('over');
  overCell=i;
  if(i>=0&&sel>=0&&fits(run.hand[sel],i,frontier()))board.children[i].classList.add('over');
  setPreview(i);
}
document.addEventListener('pointerdown',e=>{
  if(!run||run.phase!=='build'||busy||(e.pointerType==='mouse'&&e.button!==0))return;
  const s=e.target.closest('.slot'),c=e.target.closest('.cell');
  if(!(s&&handEl.contains(s))&&!(c&&board.contains(c)))return;
  if(s)e.preventDefault();
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,slot:s?+s.dataset.i:-1,cell:!s?+c.dataset.i:-1,moving:false};
},{passive:false});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id||drag.slot<0)return;
  if(!drag.moving){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;
    if(!run.hand[drag.slot]){drag=null;return}
    drag.moving=true;sel=drag.slot;renderHand();refreshMarks();
    ghost=document.createElement('div');ghost.className='ghost-tile';ghost.innerHTML=svg(tileArt(run.hand[sel],true));
    document.body.appendChild(ghost);
  }
  e.preventDefault();
  ghost.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;
  setOver(dropCell(e.clientX,e.clientY));
},{passive:false});
function endPointer(e,cancel){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;
  if(ghost){ghost.remove();ghost=null}
  setOver(-1);
  if(cancel)return;
  if(d.moving){
    const t=dropCell(e.clientX,e.clientY);
    if(t>=0)place(t,d.slot);else flashSlot(d.slot);
    return;
  }
  if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>10)return;
  if(d.slot>=0)tapSlot(d.slot);else if(d.cell>=0)tapCell(d.cell);
}
document.addEventListener('pointerup',e=>endPointer(e,false));
document.addEventListener('pointercancel',e=>endPointer(e,true));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.board,.tray'))e.preventDefault()});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  if(!run||run.phase!=='build'||busy)return;
  const s=e.target.closest&&e.target.closest('.slot'),c=e.target.closest&&e.target.closest('.cell');
  if(s&&handEl.contains(s)){e.preventDefault();tapSlot(+s.dataset.i)}
  else if(c&&board.contains(c)){e.preventDefault();tapCell(+c.dataset.i)}
});

/* ---------- buttons ---------- */

{ // a tap asks first; holding until the ring fills goes home at once
  const q=$('quit');let t=0,held=false;
  const stop=()=>{clearTimeout(t);q.classList.remove('hold')};
  q.addEventListener('pointerdown',e=>{
    if(!run||busy||(e.pointerType==='mouse'&&e.button!==0))return;
    held=false;q.classList.add('hold');
    t=setTimeout(()=>{held=true;stop();if(run&&!busy)gameOver('quit')},650);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(k=>q.addEventListener(k,stop));
  q.addEventListener('contextmenu',e=>e.preventDefault());
  q.addEventListener('click',()=>{
    if(held){held=false;return}
    if(!run||busy)return;
    $('q-text').textContent=`ここまでの金貨 ${run.gold} を持ち帰って、強化に使える。`;show('s-quit');
  });
}
$('q-no').addEventListener('click',hideSheets);
$('q-yes').addEventListener('click',()=>gameOver('quit'));
$('r-list').addEventListener('click',e=>{const b=e.target.closest('.choice');if(b)takeReward(+b.dataset.i)});
$('t-new').addEventListener('click',()=>{if(run){meta.bank+=run.gold;saveMeta()}store.del(SAVE);newRun()});
$('t-cont').addEventListener('click',()=>{if(run)resume()});
$('t-shop').addEventListener('click',showShop);
$('o-shop').addEventListener('click',showShop);
$('o-again').addEventListener('click',newRun);
$('o-title').addEventListener('click',showTitle);
$('sh-list').addEventListener('click',e=>{const b=e.target.closest('.choice');if(b&&!b.disabled)buy(b.dataset.k)});
$('sh-go').addEventListener('click',()=>{if(run)resume();else newRun()});
$('sh-back').addEventListener('click',showTitle);
window.addEventListener('resize',()=>{if(run)placeHero(run.at,true)});
